<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#07060f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png"><title>Neon Rush: Street Legends</title>
<style>html,body{margin:0;height:100%;background:#07060f;color:#f2f0ff;font:700 17px "Trebuchet MS",Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0}#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.p{background:#100c22cc;border-left:3px solid #ff2d8a;padding:16px 20px;max-width:640px;max-height:96%;overflow:auto;backdrop-filter:blur(6px)}
h1{margin:0;color:#ff2d8a;font-size:36px;text-shadow:0 0 16px #ff2d8a}h2{color:#19e6ff;letter-spacing:3px;font-size:16px}
button,input{font:inherit;color:#fff;background:#ffffff14;border:1px solid #fff4;padding:10px 14px;margin:4px;min-height:44px;box-sizing:border-box}
input{display:block;width:100%}button{cursor:pointer}button:hover,button.on{background:#ff2d8a}button:disabled{opacity:.35}
button small{display:block;font-size:11px;color:#19e6ff}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.sw{display:inline-block;width:34px;height:34px;margin:4px;border:2px solid #fff;cursor:pointer}
#tc{display:none}@media(pointer:coarse){#tc.on{display:block}}
#tc b{position:fixed;bottom:16px;width:74px;height:74px;border-radius:50%;background:#ffffff26;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-size:13px}
</style></head><body><canvas id="c"></canvas><div id="ui"></div>
<div id="tc"><b data-k="l" style="left:14px">&#9664;</b><b data-k="r" style="left:98px">&#9654;</b><b data-k="b" style="right:98px">BRAKE</b><b data-k="g" style="right:14px">GAS</b><b data-k="n" style="right:14px;bottom:100px">NITRO</b><b data-k="d" style="right:98px;bottom:100px">DRIFT</b></div>
<button id="inst" style="display:none;position:fixed;top:10px;right:10px;z-index:9;background:#ff2d8a">INSTALL APP</button>
<script src="data.js"></script><script src="audio.js"></script><script src="game.js"></script><script>
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")});
var dp;addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("inst").style.display="block"});
$("inst").onclick=function(){dp.prompt();dp.userChoice.then(function(){$("inst").style.display="none"})};
addEventListener("appinstalled",function(){$("inst").style.display="none"});
document.addEventListener("click",function f(){var d=document.documentElement;if(d.requestFullscreen&&!navigator.standalone)d.requestFullscreen().catch(function(){});if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(function(){});document.removeEventListener("click",f)});
</script></body></html>
